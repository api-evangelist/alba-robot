aid: alba-robot
name: Alba Robot
description: >-
  ALBA Robot is a Turin, Italy based autonomous micro-mobility company building
  a fleet of self-driving robots for indoor and pedestrian spaces such as
  airports, hospitals, and large facilities. Its product line includes ALBA One,
  ALBA Ride, ALBA Ride +, and the ALBA Caddie autonomous baggage transport
  robot, and it layers digital services such as Digital Twins and Digital
  Out-of-Home (DOOH) advertising on top of the mobility platform. ALBA Robot
  runs pilots and deployments with airports including Cagliari, London Gatwick,
  Dallas, Milan, Turin, and Dubai (with dnata), and operates from Turin with a
  US presence in Detroit, Michigan. Surfaced as a Techstars portfolio company
  and added to the API Evangelist network. As of this enrichment pass the
  company publishes no public API, developer portal, OpenAPI, SDKs, or GitHub
  organization; it is a hardware/robotics fleet operator rather than an API
  provider.
